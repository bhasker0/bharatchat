apiVersion: v1
kind: Service
metadata:
  name: {{ include "bharatchat.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bharatchat.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "bharatchat.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
