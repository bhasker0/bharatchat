{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bharatchat.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bharatchat.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bharatchat.fullname" . }}-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bharatchat.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bharatchat.fullname" . }}-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bharatchat.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "bharatchat.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "bharatchat.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
