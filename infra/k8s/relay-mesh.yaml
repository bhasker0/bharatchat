apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-relay-mesh
  namespace: sovereign-prod
  labels:
    app.kubernetes.io/name: ephemeral-relay
    app.kubernetes.io/part-of: bharatchat-sovereign
spec:
  replicas: 6
  selector:
    matchLabels:
      app: ephemeral-relay
  template:
    metadata:
      labels:
        app: ephemeral-relay
    spec:
      containers:
        - name: relay
          image: sovereign/relay-node:v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ZERO_DISK_RETENTION
              value: "true"
            - name: RULE_4_2_ENVELOPE_ENFORCEMENT
              value: "strict"
            - name: DEFAULT_TTL_SECONDS
              value: "604800"
          ports:
            - name: websocket
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sovereign-relay-service
  namespace: sovereign-prod
spec:
  selector:
    app: ephemeral-relay
  ports:
    - name: websocket
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sovereign-relay-hpa
  namespace: sovereign-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sovereign-relay-mesh
  minReplicas: 6
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
