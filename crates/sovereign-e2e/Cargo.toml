[package]
name = "sovereign-e2e"
version = "0.1.0"
edition = "2021"
description = "End-to-End System Orchestration and Comprehensive Integration Test Suite"

[dependencies]
sovereign-core = { path = "../sovereign-core" }
sovereign-relay = { path = "../sovereign-relay" }
sovereign-storage = { path = "../sovereign-storage" }
sovereign-calls = { path = "../sovereign-calls" }
sovereign-chain = { path = "../sovereign-chain" }
sovereign-zkp = { path = "../sovereign-zkp" }
sovereign-upi = { path = "../sovereign-upi" }
sovereign-commerce = { path = "../sovereign-commerce" }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
blake3 = "1.5"
rand = "0.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
