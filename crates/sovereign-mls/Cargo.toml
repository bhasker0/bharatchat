[package]
name = "sovereign-mls"
version = "0.1.0"
edition = "2021"
description = "TreeKEM / RFC 9420 Message Layer Security for 1000+ Member Groups and Umbrella Communities"

[dependencies]
sovereign-core = { path = "../sovereign-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
blake3 = "1.5"
hex = "0.4"
rand = "0.8"
aes-gcm = { version = "0.10", features = ["aes"] }
