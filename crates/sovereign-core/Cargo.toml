[package]
name = "sovereign-core"
version = "0.1.0"
edition = "2021"
description = "Sovereign Messaging Cryptographic & Legal Compliance Core Engine"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
aes-gcm = "0.10"
blake3 = "1.5"
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
hex = "0.4"
thiserror = "1.0"

[dev-dependencies]
rand = "0.8"
